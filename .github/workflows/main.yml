name: API Automation CI

# Workflow berjalan pada 4 event:
# 1. Manual trigger lewat tab Actions di GitHub ("Run workflow")
# 2. Ada commit baru yang di-push ke branch main/master
# 3. Ada Pull Request yang dibuat/diupdate ke branch main/master (validasi sebelum merge)
# 4. Ada Pull Request yang sudah digabungkan (merged) ke branch main/master
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    types: [ opened, synchronize, reopened, closed ]

jobs:
  api-automation-test:
    name: Run API Tests (RestAssured - dummyapi.io)
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == true))

    env:
      # WAJIB diisi di: repo Settings > Secrets and variables > Actions > New repository secret
      # Daftar gratis di https://dummyapi.io untuk mendapatkan app-id
      APP_ID: ${{ secrets.APP_ID }}

    steps:
      - name: Checkout kode repository
        uses: actions/checkout@v4

      # ---------- Environment: Java 21 ----------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------- Jalankan API test (tag @api) ----------
      - name: Run API Automation Tests (@api)
        run: ./gradlew apiTest --stacktrace

      # ---------- Generate laporan Allure ----------
      - name: Generate Allure Report
        if: always()
        run: ./gradlew allureReport

      # ---------- Upload laporan Allure sebagai artefak ----------
      - name: Upload Allure Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report
          retention-days: 14

      # ---------- Upload laporan Cucumber (HTML & JSON) sebagai artefak ----------
      - name: Upload Cucumber HTML/JSON report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: build/cucumber-report/api
          retention-days: 14

      # ---------- Upload hasil mentah TestNG ----------
      - name: Upload raw test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-results
          path: |
            build/allure-results
            build/test-results
          retention-days: 14