name: API Automation CI

# Workflow berjalan pada 4 event:
# 1. Manual trigger lewat tab Actions di GitHub ("Run workflow")
# 2. Ada commit baru yang di-push ke branch main/master
# 3. Ada Pull Request yang dibuat/diupdate ke branch main/master (validasi sebelum merge)
# 4. Ada Pull Request yang sudah digabungkan (merged) ke branch main/master
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    types: [ opened, synchronize, reopened, closed ]

jobs:
  api-automation-test:
    name: Run API Tests (TestNG + RestAssured - api.rizqifauzan.com)
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (github.event.action != 'closed' || github.event.pull_request.merged == true))

    steps:
      - name: Checkout kode repository
        uses: actions/checkout@v4

      # ---------- Environment: Java 21 ----------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------- Jalankan seluruh API test (TestNG suite dari testng.xml) ----------
      # Base URL API (api.rizqifauzan.com) tidak butuh header/secret app-id, jadi tidak perlu
      # system property atau env var tambahan di sini.
      - name: Run API Automation Tests
        run: ./gradlew test --stacktrace

      # ---------- Generate laporan Allure ----------
      # Plugin io.qameta.allure v4.x men-download Node.js + npm saat pertama kali generate report,
      # jadi step ini butuh koneksi internet (runner GitHub sudah otomatis punya akses).
      - name: Generate Allure Report
        if: always()
        run: ./gradlew allureReport

      # ---------- Upload laporan Allure sebagai artefak ----------
      - name: Upload Allure Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: build/reports/allure-report/allureReport
          retention-days: 14

      # ---------- Upload hasil mentah TestNG + Allure results ----------
      - name: Upload raw test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-results
          path: |
            build/allure-results
            build/test-results
          retention-days: 14
